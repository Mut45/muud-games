							<h1 class="major">Visual Update #1</h1>
							<h2>Becomes one with the nado</h2>
							<span class="video-preview">

									muted
									loop
									playsinline
									preload="metadata"
									tabindex="0"

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>

			<script>
				document.querySelectorAll(".video-preview video").forEach((video) => {
					video.addEventListener("mouseenter", async () => {
						try {
							await video.play();
						} catch (error) {
							console.warn("The preview video could not play:", error);
						}
					});

					video.addEventListener("mouseleave", () => {
						video.pause();
						video.currentTime = 0;
					});

					video.addEventListener("focus", () => {
						video.play().catch(() => {});
					});

					video.addEventListener("blur", () => {
						video.pause();
						video.currentTime = 0;
					});
				});
			</script>
